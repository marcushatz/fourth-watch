<!doctype html>
<html><head><meta charset="utf-8"><title>PP2 contact sheet</title>
<style>html,body{margin:0;background:#8E877E;} canvas{display:block}</style></head>
<body>
<script src="lintel/people.js"></script>
<script src="lintel/people2.js"></script>
<script>
// renderSheet({cols, cw, ch, cells:[{fn, st, label, scale, ox, oy, orig}], bg})
window.renderSheet = (spec) => {
  document.querySelectorAll('canvas').forEach((c) => c.remove());
  const cols = spec.cols || 6, cw = spec.cw || 320, ch = spec.ch || 460, n = spec.cells.length, rows = Math.ceil(n / cols);
  const cv = document.createElement('canvas'); cv.width = cols * cw; cv.height = rows * ch; document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = spec.bg || '#8E877E'; ctx.fillRect(0, 0, cv.width, cv.height);
  const errs = [];
  spec.cells.forEach((c, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    ctx.save();
    ctx.fillStyle = (i + Math.floor(i / cols)) % 2 ? '#958E85' : '#8E877E'; ctx.fillRect(x, y, cw, ch);
    ctx.beginPath(); ctx.rect(x, y, cw, ch); ctx.clip();
    // ground line
    const gy = y + ch - (c.oy ?? 30);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + cw, gy); ctx.stroke();
    ctx.translate(x + cw / 2 + (c.ox || 0), gy); const s = c.scale || 0.7; ctx.scale(s, s);
    try {
      const st = Object.assign({}, c.st || {});
      if (c.multi) for (const m of c.multi) { ctx.save(); let dx = m.dx || 0, dy = m.dy || 0; if (m.anchor) { const A = PP2.ANCHOR[m.anchor]; dx += A[0]; dy += A[1]; } ctx.translate(dx, dy); if (m.orig) PP[m.fn](ctx, Object.assign({}, m.st)); else if (m.fn === 'pillar') { ctx.fillStyle = '#B9A88C'; ctx.strokeStyle = '#24160F'; ctx.lineWidth = 2.6; ctx.fillRect(-28, -900, 56, 900); ctx.strokeRect(-28, -900, 56, 900); } else PP2[m.fn](ctx, Object.assign({}, m.st)); ctx.restore(); }
      else if (c.orig) PP[c.fn](ctx, st); else PP2[c.fn](ctx, st);
      if (c.mark && st[c.mark[0]] != null) { ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(st[c.mark[0]], st[c.mark[1]], 5 / s, 0, 7); ctx.fill(); }
      if (c.marks) for (const m of c.marks) { ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(m[0], m[1], 5 / s, 0, 7); ctx.fill(); }
    } catch (e) { errs.push(c.label + ': ' + e.message + ' ' + (e.stack || '').split('\n')[1]); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#f00'; ctx.fillRect(x + 4, y + 4, 20, 20); }
    ctx.restore();
    ctx.fillStyle = 'rgba(20,12,8,0.85)'; ctx.font = '600 15px sans-serif'; ctx.fillText(c.label || '', x + 8, y + 20);
  });
  return { w: cv.width, h: cv.height, errs };
};
</script>
</body></html>
