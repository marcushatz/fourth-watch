<script>
window.test = () => {
  const out = [];
  for (const name of Object.keys(PP2.SIZES)) {
    const bb = PP2.bill(name, { pose: name === 'samsonSleep' ? 'sleep' : undefined });
    bb.userData.update('k1', { t: 0.5 });
    const S = PP2.SIZES[name];
    out.push(name + ' worldH=' + S.worldH + ' planeH=' + bb.geometry.parameters.height.toFixed(3));
  }
  return out;
};
</script></body></html>
