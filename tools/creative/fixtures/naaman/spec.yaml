# TEST FIXTURE, not a script or a storyboard. 2 Kings 5 is a test bed for `compile_spec.py --target dio`, as Esau and Jacob are
# in the engine lab. It uses every preset family, every working move and every transition kind that reaches `xin`.
sequence: {id: NAAMAN_FIXTURE, window: [0.12, 19.0], treatment: T1}
dio_sets:
  syria:
    sky: dusk
    style: paint
    seed: 5
    ground: {radius: 7, cols: ['#B49C62', '#A68F58', '#BFA86E'], hills: 0.25, seed: 5}
    props:
      - {id: tent, kind: tent, at: [-2.0, -1.5], s: 1.2, rot: 0.5, cols: ['#D8C4A0', '#7A4E2A']}
      - {kind: olive, at: [4.2, -3.0], s: 1.2}
      - {kind: rock, at: [2.4, 1.8], s: 0.7}
    people:
      - {id: naaman, at: [0.4, 0.3], pose: stand, health: 0.25, hires: true}
      - {id: messenger, at: [-0.9, 2.0], pose: stand}
  jordan:
    sky: dawn
    style: paint
    seed: 8
    ground: {radius: 7, cols: ['#8FA07A', '#7E9070', '#A8A882'], hills: 0.2, seed: 8}
    props:
      - {id: bank, kind: rock, at: [1.0, 1.0], s: 0.6}
      - {kind: bush, at: [-3.2, -1.6], s: 1.0}
    people:
      - {id: naaman, at: [0.2, 0.2], pose: stand, health: 0.25, hires: true}
      - {id: servant, at: [-0.9, -1.1], pose: stand, hires: true}
scenes:
  - id: N1
    t: [0.12, 3.52]
    vo: [{line: 0, from: "Naaman", to: "leper."}]
    set: {scene: diorama, v: syria}
    action:
      - {at: "commanded", who: naaman, pose: stand, does: "stands at the centre of the camp"}
    comp: {size: WS, angle: high, subject_y: 0.46}
    cam: {on: naaman, move: push, amt: 0.08, ease: inOut, start: "commanded"}
    light: {key: none, gold: 0.0, change: "none"}
    reads:
      - {t: [0.12, 1.20], kind: place, what: "a military camp at dusk", eye: "the whole set, tents upper left"}
      - {t: [1.20, 2.15], kind: entity, what: "Naaman at its centre", eye: "the push leads to him"}
      - {t: [2.15, 3.40], kind: entity, what: "his skin is grey-green", eye: "he is the only drained colour in the warm frame"}
    trans_out: {kind: fade}
    reuse: {rig: [person.stand], devices: [camera]}
    new: []
    verses: ["2 Kings 5:1"]
  - id: N2
    t: [3.52, 6.72]
    vo: [{line: 1, from: "Elisha", to: "times."}]
    set: {scene: diorama, v: syria}
    action:
      - {at: "sent", who: messenger, pose: stand, does: "stands facing Naaman"}
    comp: {size: MS, angle: ots, subject_y: 0.46}
    cam: {on: naaman, over: messenger, move: track, amt: 0.05, ease: inOut, start: "wash"}
    light: {key: focal_warm, on: naaman, gold: 0.0, change: "a warm pool settles on Naaman"}
    text: {kind: bubble, words: "wash in the Jordan seven times", t: [4.90, 6.60]}
    reads:
      - {t: [3.52, 4.80], kind: entity, what: "the messenger's shoulder, Naaman beyond him", eye: "the sharp figure past the soft shoulder"}
      - {t: [4.90, 6.60], kind: text, what: "the instruction", eye: "the bubble pops beside Naaman, read with the voice"}
    trans_out: {kind: cut, note: "hard cut on his name"}
    reuse: {rig: [person.stand], devices: [camera, bubble]}
    new: []
    verses: ["2 Kings 5:10"]
  - id: N3
    t: [6.72, 9.02]
    vo: [{line: 2, from: "Naaman", to: "away."}]
    set: {scene: diorama, v: syria}
    action:
      - {at: "went", who: naaman, do: walk, to: [2.6, 1.3], dur: 0.9, does: "turns and walks off, shoulders square"}
    comp: {size: WS, angle: low, subject_y: 0.47}
    cam: {on: naaman, move: follow}
    light: {key: none, gold: 0.0, change: "none"}
    reads:
      - {t: [6.72, 7.90], kind: entity, what: "Naaman, seen from below", eye: "the low angle stacks him against the sky"}
      - {t: [7.95, 8.95], kind: action, what: "he walks away", eye: "the camera stays with him"}
    trans_out: {kind: whip, dir: left, note: "travel to the river"}
    reuse: {rig: [person.walk], devices: [camera]}
    new: []
    verses: ["2 Kings 5:11"]
  - id: N4
    t: [9.02, 11.52]
    vo: [{line: 3, from: "Then", to: "him."}]
    set: {scene: diorama, v: jordan}
    action:
      - {at: "spoke", who: servant, pose: stand, does: "stands close beside him and speaks"}
    comp: {size: MCU, angle: eye, subject_y: 0.45}
    cam: {on: servant, to: naaman, move: rack, ease: inOut, start: "spoke"}
    light: {key: none, gold: 0.0, change: "none"}
    reads:
      - {t: [9.02, 10.00], kind: entity, what: "a servant, close", eye: "the sharp figure"}
      - {t: [10.00, 11.40], kind: entity, what: "Naaman listening", eye: "focus racks from the servant to him"}
    trans_out: {kind: push, dir: up}
    reuse: {rig: [person.stand], devices: [camera]}
    new: []
    verses: ["2 Kings 5:13"]
  - id: N5
    t: [11.52, 15.02]
    vo: [{line: 4, from: "So", to: "Jordan."}]
    set: {scene: diorama, v: jordan}
    action:
      - {at: "went", who: naaman, do: walk, to: [0.9, 0.6], dur: 1.2, does: "walks down toward the water"}
    comp: {size: WS, angle: eye, subject_y: 0.46}
    cam: {on: naaman, move: pan, deg: 6, ease: inOut, start: "dipped"}
    light: {key: none, gold: 0.0, change: "none"}
    reads:
      - {t: [11.52, 13.00], kind: action, what: "he goes down to the river", eye: "he is the only thing moving"}
      - {t: [13.00, 14.90], kind: action, what: "the seven dips, counted", eye: "the camera eases with him"}
    trans_out: {kind: dip}
    reuse: {rig: [person.walk], devices: [camera]}
    new: []
    verses: ["2 Kings 5:14"]
  - id: N6
    t: [15.02, 16.62]
    vo: [{line: 5, from: "His", to: "restored,"}]
    set: {scene: diorama, v: jordan}
    action:
      - {at: "restored,", who: naaman, health: 1, does: "the colour comes back to his skin"}
    comp: {size: CU, angle: low, subject_y: 0.5}
    cam: {on: naaman, move: push, amt: 0.06, ease: inOut, start: "flesh"}
    light: {key: focal_warm, on: naaman, gold: 0.9, at: "restored,", change: "gold arrives from the upper left on 'restored'"}
    reads:
      - {t: [15.02, 15.90], kind: entity, what: "his face, still drained", eye: "the frame is only him"}
      - {t: [15.90, 16.70], kind: light, what: "gold lands and his colour returns", eye: "the light moves down from the upper left"}
    trans_out: {kind: flashIn}
    reuse: {rig: [person.stand], devices: [camera, rays]}
    new: []
    verses: ["2 Kings 5:14"]
  - id: N7
    t: [16.62, 19.0]
    vo: [{line: 5, from: "and", to: "clean."}]
    set: {scene: diorama, v: jordan}
    action: []
    comp: {size: insert, angle: high, subject_y: 0.5}
    cam: {on: bank, move: tilt, deg: 5, ease: inOut, start: "clean."}
    light: {key: none, gold: 0.5, at: "and", change: "gold stays on the riverbank"}
    text: {kind: verse, words: "and his flesh was restored like the flesh of a little child, and he was clean.", ref: "2 Kings 5:14 (ESV)", t: [16.70, 19.0]}
    reads:
      - {t: [16.62, 18.90], kind: text, what: "verse card", eye: "the card fades up in the top band, read with the voice"}
    trans_out: {kind: hold}
    reuse: {rig: [], devices: [camera, rays, verse]}
    new: []
    verses: ["2 Kings 5:14"]
