<style>
/* A dark screening room built from the brand palette, so every frame is judged against the same neutral ground.
   Layout: tabs across the top, a frame wall for browsing, and a large side-by-side stage for comparing. */
:root {
  color-scheme: dark;
  --night: #14100d; --umber: #211812; --panel: #2a1e16; --line: #4a382a;
  --ash: #b3a797; --parch: #f2e6cf; --gold: #e3b25c; --ember: #d0653f;
  --display: "Cinzel", "Times New Roman", serif;
  --body: "Alegreya Sans", "Trebuchet MS", sans-serif;
  --verse: "Cormorant Garamond", Georgia, serif;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--night);color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
header.top{padding-block:28px 12px;max-width:1500px;margin-inline:auto}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,40px);letter-spacing:.04em;margin:0;text-wrap:balance}
.lede{font-family:var(--verse);font-style:italic;font-size:clamp(19px,2.4vw,24px);color:var(--ash);margin:6px 0 0;max-width:62ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);border-bottom:1px solid var(--line);margin-inline:auto;max-width:1500px;display:flex;gap:4px;flex-wrap:wrap;padding-block:8px}
nav.tabs button{background:none;border:0;padding:8px 13px;color:var(--ash);font-weight:500;border-radius:4px}
nav.tabs button[aria-selected=true]{color:var(--night);background:var(--gold)}
main{max-width:1500px;margin-inline:auto;padding-top:20px}
section[hidden]{display:none}
h2{font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:.03em;margin:30px 0 10px;text-wrap:balance}
h2:first-child{margin-top:4px}
h3{font-size:17px;margin:18px 0 4px;font-weight:700}
p{max-width:72ch;margin:8px 0}
.note{color:var(--ash);font-size:15px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 13px;color:var(--ash)}
.seg button[aria-pressed=true]{background:var(--parch);color:var(--night);font-weight:700}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(172px,44vw),1fr));gap:18px 14px}
.card{min-width:0;display:flex;flex-direction:column;gap:6px}
.frame{position:relative;aspect-ratio:9/16;background:var(--umber);border:0;padding:0;display:block;width:100%;overflow:hidden;border-radius:3px}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .tag{position:absolute;left:6px;bottom:6px;background:rgba(20,16,13,.82);color:var(--parch);font-size:12px;padding:2px 6px;border-radius:3px}
.card h3{margin:2px 0 0;font-size:16px;line-height:1.2}
.card .cap{color:var(--ash);font-size:14px;line-height:1.3}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;min-width:0}
.chip{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ash)}
.chip.high{border-color:#6e9a6a;color:#a9d3a4}.chip.med{border-color:#a98b4e;color:#e3c37f}.chip.low{border-color:#a8604a;color:#e79a80}
.fav{background:none;border:0;font-size:20px;line-height:1;color:var(--ash);padding:2px}
.fav[aria-pressed=true]{color:var(--gold)}
.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:14px}
.stage{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.stage figure{margin:0;min-width:0}
.stage figcaption{font-size:14px;padding-top:4px;color:var(--parch)}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pick button{background:none;border:1px solid var(--line);color:var(--ash);border-radius:99px;padding:3px 10px;font-size:14px}
.pick button[aria-pressed=true]{background:var(--panel);color:var(--parch);border-color:var(--gold)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--ash);font-weight:500;font-size:14px;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums}
#viewer{position:fixed;inset:0;z-index:30;background:#0a0807;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px))}
#viewer[hidden]{display:none}
#viewer .head{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--parch);padding-bottom:6px}
#viewer .pane{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
#viewer img{height:100%;width:auto;max-width:100%;object-fit:contain;margin:auto}
#viewer.zoom img{height:auto;width:1080px;max-width:none;margin:0 auto}
#viewer button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 11px}
dialog{background:var(--umber);color:var(--parch);border:1px solid var(--line);border-radius:8px;max-width:min(860px,calc(100vw - 24px));width:100%;padding:20px;max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,4,3,.75)}
.dframes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.rate{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:6px 12px;align-items:center;max-width:430px}
.dots{display:flex;gap:4px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ash);font-size:14px;padding:0}
.dots button[aria-pressed=true]{background:var(--gold);color:var(--night);border-color:var(--gold)}
.tech dt{font-weight:700;margin-top:10px}.tech dd{margin:2px 0 0;color:var(--ash)}
.prov{font-size:13px;color:var(--ash)}
ul.tight{margin:6px 0;padding-left:20px;max-width:72ch}ul.tight li{margin:4px 0}
.status{font-size:13px;color:var(--ash)}
@media (max-width:520px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{grid-auto-columns:minmax(46vw,1fr)}}
@media (prefers-reduced-motion:no-preference){.frame img{transition:transform .25s ease}.frame:hover img{transform:scale(1.015)}}
</style>
