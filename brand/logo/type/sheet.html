<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:Cinzel;src:url(cinzel-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Corm;src:url(cormorant-garamond-latin-500-italic.woff2);font-style:italic}
@font-face{font-family:Inter;src:url(inter-latin-600-normal.woff2);font-weight:600}
body{margin:0;background:#0E0B09;font-family:Inter;color:#8C8174}
.wrap{display:flex;gap:70px;padding:50px 60px;align-items:center}
.col{display:flex;flex-direction:column;gap:26px;align-items:center}
.lab{font-size:16px;letter-spacing:.08em}
.row{display:flex;gap:30px;align-items:center}
.av{border-radius:50%;background:radial-gradient(circle at 40% 30%,#241B15,#100C0A 70%);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(227,178,92,.25) inset}
.stack{font-family:Cinzel;font-weight:700;color:#F2E6CF;text-align:center;line-height:1.02}
.stack .r{display:block;width:44%;height:2px;margin:.16em auto;background:#E3B25C}
.mono{font-family:Cinzel;font-weight:700;color:#F2E6CF;letter-spacing:-.04em}
.mono b{color:#E3B25C;font-weight:700}
.card{width:540px;height:960px;background:#0E0B09;position:relative;overflow:hidden}
.card .glow{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 32%,rgba(227,178,92,.13),rgba(227,178,92,0) 55%)}
.card .in{position:absolute;left:0;right:0;top:330px;display:flex;flex-direction:column;align-items:center;gap:22px}
.wm{font-family:Cinzel;font-weight:700;color:#F2E6CF;font-size:44px;letter-spacing:.2em;padding-left:.2em;white-space:nowrap}
.q{font-family:Corm;font-style:italic;color:#E9DCC2;font-size:25px;line-height:1.35;text-align:center;width:400px}
.ref{font-size:12px;letter-spacing:.36em;padding-left:.36em;color:#8C8174}
.rule{width:60px;height:2px;background:rgba(227,178,92,.7)}
</style></head><body><div class=wrap>
<div class=col><div class=lab>A · STACKED NAME</div><div class=row>
 <div class=av style="width:320px;height:320px"><div class=stack style="font-size:52px">FOURTH<span class=r></span>WATCH</div></div>
 <div class=av style="width:110px;height:110px"><div class=stack style="font-size:18px">FOURTH<span class=r></span>WATCH</div></div>
 <div class=av style="width:44px;height:44px"><div class=stack style="font-size:7.5px">FOURTH<span class=r></span>WATCH</div></div></div></div>
<div class=col><div class=lab>B · MONOGRAM</div><div class=row>
 <div class=av style="width:320px;height:320px"><div class=mono style="font-size:150px">F<b>W</b></div></div>
 <div class=av style="width:110px;height:110px"><div class=mono style="font-size:52px">F<b>W</b></div></div>
 <div class=av style="width:44px;height:44px"><div class=mono style="font-size:21px">F<b>W</b></div></div></div></div>
<div class=col><div class=lab>END CARD · NAME + THE VERSE</div>
 <div class=card><div class=glow></div><div class=in>
  <div class=wm>FOURTH WATCH</div><div class=rule></div>
  <div class=q>"And in the fourth watch of the night he came to them, walking on the sea."</div>
  <div class=ref>MATTHEW 14:25</div></div></div></div>
</div></body></html>
