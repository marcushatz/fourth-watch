<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cinz;font-weight:600;src:url(cinzel-latin-600-normal.woff2)}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
#word{position:absolute;left:0;right:0;top:1335px;text-align:center;font:600 78px Cinz;letter-spacing:.14em;padding-left:.14em;color:#F2E6CF;
 text-shadow:0 0 28px rgba(227,178,92,.35),0 3px 10px rgba(0,0,0,.6);opacity:0}
</style></head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="word">FOURTH WATCH</div>
<script>
// Fourth Watch outro: a painted scene brought to life. Every frame is a pure function of t (seconds).
const P = {
  jesus:[0.234,0.335], lantern:[0.863,0.308], moon:[0.779,0.080],
  waterTop:0.53,                 // waves animate only below this line, so Jesus and the boat stay still
};
const cv=document.getElementById('gl'); const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;varying vec2 uv;uniform sampler2D img;uniform float t,zoom,expo,reveal,beam,lamp,word;
uniform vec2 jc,lc,zc;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 q=zc+(uv-zc)/zoom;                         // slow push-in
  float w=smoothstep(${P.waterTop.toFixed(3)},${(P.waterTop+0.09).toFixed(3)},q.y); // water mask
  vec2 d=vec2(n(q*vec2(9.,26.)+vec2(t*.35,t*.12))-.5, n(q*vec2(14.,30.)-vec2(t*.22,t*.30))-.5);
  vec3 c=texture2D(img,q+d*.0055*w).rgb;
  // darkness and reveal: lantern first, then the light opens on Jesus
  float dj=distance(vec2(q.x,q.y*1.78),vec2(jc.x,jc.y*1.78));
  float m=smoothstep(reveal+.22,reveal-.10,dj);
  float e=max(expo,m);
  c*=mix(.10,1.,e);
  // lantern glow (always on, flickers)
  float dl=distance(vec2(q.x,q.y*1.78),vec2(lc.x,lc.y*1.78));
  c+=vec3(1.,.62,.25)*lamp*exp(-dl*dl/0.0016)*.55;
  c+=vec3(1.,.55,.2)*lamp*exp(-dl*dl/0.012)*.12;
  // light beam shimmer from the top left
  float bx=q.x+q.y*.55; float ray=.5+.5*sin(bx*55.+t*.9)*sin(bx*21.-t*.6);
  float bm=smoothstep(.62,.0,bx)*smoothstep(.75,.15,q.y);
  c+=vec3(1.,.82,.45)*beam*bm*(.05+.06*ray);
  // gentle vignette
  vec2 v=uv-.5; c*=1.-dot(v,v)*.55;
  gl_FragColor=vec4(c,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=k=>gl.getUniformLocation(pr,k);
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
const lin=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a)));
window.ready=new Promise(res=>{const im=new Image();im.onload=()=>{const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);document.fonts.ready.then(res);};im.src='scene.png';});
window.renderAt=function(t){
  const z=1.0+0.045*ease(t/5.5);
  const expo=.10+.90*ease(lin(t,1.0,2.4));          // whole scene comes up after the reveal starts
  const reveal=-.15+.75*ease(lin(t,0.8,2.2));       // light opens outward from Jesus
  const lamp=ease(lin(t,0.0,0.7))*(.85+.15*Math.sin(t*13.)*Math.sin(t*7.3+1.));
  const beam=ease(lin(t,0.8,2.0));
  gl.uniform1f(U('t'),t);gl.uniform1f(U('zoom'),z);gl.uniform1f(U('expo'),expo);gl.uniform1f(U('reveal'),reveal);
  gl.uniform1f(U('beam'),beam);gl.uniform1f(U('lamp'),lamp);
  gl.uniform2f(U('jc'),...P.jesus);gl.uniform2f(U('lc'),...P.lantern);gl.uniform2f(U('zc'),0.42,0.40);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  const wt=ease(lin(t,2.2,3.0)); const el=document.getElementById('word');
  el.style.opacity=wt; el.style.transform=`translateY(${(1-wt)*18}px)`;
};
</script></body></html>
